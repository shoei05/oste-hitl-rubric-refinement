# OSTE評価ルーブリック
# 5段階評価スケール

rubric_id: detailed_rubric_u1_u20_strict_v3
version: strict_v3_hitl_2026-04-24

global_evaluation_guidelines:
  scoring_scale:
    5: "とてもそう思う - 非常に良い指導の仕方である。他の指導医の模範となる指導方法である。"
    4: "ややそう思う - 平均以上の指導の仕方である。"
    3: "どちらとも言えない - 平均的な指導の仕方である。"
    2: "あまりそう思わない - 指導の仕方に問題が多い。"
    1: "まったくそう思わない - 指導の仕方に問題が多く、研修医の研修を阻害する。"
    X: "評価不能 - 実施するタイミングがなかった"

  time_management:
    time_limit: "5分"
    overtime_handling: "5分を超えた場合は、それまでに実施された内容で評価"

  assessment_criteria:
    score_1: "実施できるタイミングがあったのに実施していなかった場合"
    score_X: "そもそもロールプレイ中にその項目を実施するタイミングがなかった場合"

rubric_items:
  U1:
    title: "積極的に学習者の話を聞こうとしていた"
    category: "意見を聴取する"
    criteria:
      5: "学習者の発言を積極的に促し、深く聞く姿勢が一貫（学習者発話比率40%以上）"
      4: "学習者の話を積極的に聞く姿勢が明確（学習者発話比率30-40%）"
      3: "学習者の話を聞く基本的な姿勢あり（学習者発話比率20-30%）または聞きすぎて指導時間が不足"
      2: "聞く姿勢が不十分（学習者発話比率10-20%）"
      1: "ほとんど聞く姿勢がない（学習者発話比率10%未満）"
      X: "学習者の発言機会がなかった場合"

  U2:
    title: "理解を深めるための質問をしていた"
    category: "意見を聴取する"
    criteria:
      5: "理解を深める質問を適切に実施（2-3回の質の高い深掘り質問）"
      4: "理解を深める質問を実施（1-2回）"
      3: "質問はしているが多すぎる（4回以上）または表面的"
      2: "質問が不十分"
      1: "理解を深める質問をしていない"
      X: "質問する機会がなかった場合"

  U3:
    title: "学習者になぜそう考えたかを聞こうとしていた"
    category: "根拠を確認する"
    description: "プレゼンテーション後の根拠確認（Why質問）の実施"
    criteria:
      5: "学習者の考えの根拠を適切に確認（プレゼン後60-120秒以内にWhy質問、1-2回）"
      4: "根拠を確認（プレゼン後180秒以内にWhy質問）"
      3: "根拠確認はしているが過剰（3回以上）または遅い"
      2: "根拠確認が不十分"
      1: "根拠を確認していない（明らかな機会を逃している）"
      X: "学習者からの具体的な考えの表明がなかった場合"

  U4:
    title: "正しいことを承認していた"
    category: "正しいことを承認する"
    criteria:
      5: "正しい考えや行動を具体的に承認（2-3回の質の高い承認）"
      4: "正しいことを適切に承認（1-2回）"
      3: "承認はしているが過剰（4回以上で形式的）または曖昧"
      2: "承認が不十分"
      1: "承認していない"
      X: "承認すべき正しい内容がなかった場合"

  U5:
    title: "改善したほうが良い点を指摘していた"
    category: "間違いを修正する"
    criteria:
      5: "改善点を建設的かつ具体的に指摘し、改善方法も提示（1-2点）"
      4: "改善点を適切に指摘（1-2点）"
      3: "指摘はしているが多すぎる（3点以上）または曖昧"
      2: "指摘が不適切または不十分"
      1: "適切な指摘なし"
      X: "改善すべき点がなかった場合"

  U6:
    title: "欠けている知識を提供していた"
    category: "間違いを修正する"
    criteria:
      5: "必要な知識を的確に提供（2-3個の重要知識）"
      4: "欠けている知識を適切に提供（1-2個）"
      3: "知識提供はしているが過剰（4個以上）または不適切"
      2: "知識提供が不十分"
      1: "知識を提供していない"
      X: "知識不足が明らかでなかった場合"

  U7:
    title: "より可能性が高いまたはより緊急な診断を優先するように学習者に求めていた"
    category: "間違いを修正する"
    description: "Teaching形式での指導も可"
    criteria:
      5: "診断の優先順位について明確で教育的な指導（1-2回、理由も含む）"
      4: "優先順位について適切に指導"
      3: "指導はしているが過剰または不明瞭"
      2: "優先順位指導が不十分"
      1: "優先順位について指導していない（機会があったのに）"
      X: "鑑別診断の話題にならなかった場合"

  U8:
    title: "一般論について、根拠をつけて伝えていた"
    category: "一般論を示す"
    criteria:
      5: "一般論を根拠とともに明確に伝える（1-2個の重要な一般論）"
      4: "一般論を根拠とともに適切に伝える"
      3: "一般論は伝えているが過剰（3個以上）または根拠が曖昧"
      2: "根拠が不十分"
      1: "根拠なしまたは一般論なし"
      X: "一般論を伝える機会がなかった場合"

  U9:
    title: "学習者の注意・関心に合わせて一般論を提示できた"
    category: "一般論を示す"
    scoring_note: "5点は『引き出し＋絞り込みの合意』が必須。証拠がなければ4点止まり。"
    criteria:
      5: "学習者の関心を明示的に引き出し、合意の上で1-2点に絞って一般論を提示し、理解確認まで行う"
      4: "学習者の関心に沿った一般論を提示しているが、関心の明示的な引き出し・絞り込みの合意・理解確認のいずれかが確認できない"
      3: "教育はしているが焦点が散漫または過剰で、学習者の関心との対応が弱い"
      2: "学習者の関心に触れてはいるが、内容がずれている、または一方通行で配慮が不十分"
      1: "学習者の関心を無視した一般論の提示"
      X: "学習者の関心が記録や会話から判断不能な場合"

  U10:
    title: "重要なポイントとその理由を分かりやすく説明していた"
    category: "一般論を示す"
    criteria:
      5: "重要ポイントを明確に説明（1-2個、理由も明確）"
      4: "重要ポイントと理由を適切に説明"
      3: "説明はしているが多すぎる（3個以上）または不明瞭"
      2: "説明が不十分"
      1: "説明していない"
      X: "重要ポイントを説明する機会がなかった場合"

  U11:
    title: "目の前の問題に対して、有効なアドバイスを提供していた"
    category: "フィードバック自体"
    criteria:
      5: "具体的で実用的なアドバイスを適切に提供（1-2個の質の高いアドバイス）"
      4: "有効なアドバイスを提供"
      3: "アドバイスはしているが多すぎる（3個以上）または一般的"
      2: "アドバイスが不十分または有効性が低い"
      1: "有効なアドバイスなし"
      X: "具体的な問題が明らかでなかった場合"

  U12:
    title: "指導医の思考過程がみえる指導をしていた"
    category: "フィードバック自体"
    criteria:
      5: "自分の思考過程を明確に示し、理解しやすい指導"
      4: "思考過程が見える指導を実施"
      3: "思考過程は示しているが冗長または不明瞭"
      2: "思考過程の提示が不十分"
      1: "思考過程を示さない"
      X: "思考過程を示す機会がなかった場合"

  U13:
    title: "学習者の考え（理由・意図・自己評価）を踏まえたフィードバック"
    category: "フィードバック自体"
    scoring_note: "5点は『考えの引き出し（質問）＋理解確認（要約/言い換え）＋個別化』のうち2つ以上が必要。"
    criteria:
      5: "学習者の考えを質問で引き出し、要約して理解を確認した上で、その考えに合わせた個別化フィードバックを行い、次の具体行動を合意する"
      4: "学習者の考えに触れてフィードバックしているが、考えの引き出し・要約確認・個別化・次の行動の合意の証拠が不足している"
      3: "フィードバックはあるが、学習者の考えとの関連が不明瞭"
      2: "学習者の考えへの配慮が乏しく、指示や評価が中心である"
      1: "学習者の考えを無視または否定して一方的に結論だけ提示する"
      X: "学習者の考えが示されず、教員側も引き出していないため判断不能"

  U14:
    title: "フィードバックは具体的で詳細であった"
    category: "フィードバック自体"
    description: "観察に基づいた、具体的で、行動に移しやすく、焦点化されたフィードバック"
    scoring_note: "5点は『観察事実→行動提案→理解確認または合意』が必須。具体っぽい表現だけでは5にしない。"
    criteria:
      5: "フィードバックに行動計画、観察事実に基づく説明、理解確認または合意の全てが含まれている"
      4: "フィードバックは具体的であるが、行動計画、観察事実に基づく説明、理解確認または合意のいずれかが欠ける"
      3: "フィードバックはあるが、抽象的で学習者が次に何をすればよいか不明"
      2: "具体性が不十分で、改善につながる情報が少ない"
      1: "抽象的で詳細性に欠け、行動改善に結びつかない"
      X: "フィードバックする機会がなかった場合"

  U15:
    title: "フィードバック項目を適切な数に限定し、優先順位づけできた"
    category: "フィードバック自体"
    description: "原則2-3項目が最適。1項目でも可。多すぎは学習効果を下げる。"
    scoring_note: "5点は『2-3項目』に加えて『優先順位（最重要）』か『理由』か『次の行動』が明示されていること。数だけなら4点。"
    criteria:
      5: "2-3項目に限定し、最重要項目を明示し、理由または次の具体行動まで提示"
      4: "1-3項目に限定しているが、優先順位・理由・次の具体行動が明示されていない、または弱い"
      3: "4項目（やや多い）"
      2: "5-6項目で多すぎる、または0項目でフィードバックがない"
      1: "7項目以上、または列挙中心で焦点化や優先順位づけがない"
      X: "フィードバック機会がなかった場合"

  U16:
    title: "安全な学習環境を提供していた"
    category: "環境づくり"
    scoring_note: "5点は『能動的な安全確保行動』が2つ以上、または『リスク場面での適切対応』が明示されること。穏やかな雰囲気だけでは4点。"
    criteria:
      5: "心理的安全性を能動的に作る言動が継続し、ミスや不明点が出た場面でも非難せず学習に変換している証拠がある"
      4: "学習環境は適切で不安全要素はないが、能動的な安全確保行動やミスへの対応証拠が十分ではない"
      3: "基本的には安全だが、緊張を下げる工夫や発言促進が乏しい"
      2: "学習環境の安全性が不十分"
      1: "学習環境が不安全"
      X: "評価材料が不十分な場合"

  U17:
    title: "相談しやすい雰囲気を形成していた"
    category: "環境づくり"
    scoring_note: "5点は『相談を促す具体行動（問いかけ/窓口/時間設定など）』が確認できること。雰囲気が良いだけは4点。"
    criteria:
      5: "相談を能動的に促す行動があり、実際の相談に対して遮らず歓迎し支援につなげている証拠がある"
      4: "相談しやすい印象はあるが、促しの具体行動や相談対応の証拠が不足している"
      3: "基本的に相談は可能だが、相談の入り口が弱い"
      2: "相談しやすい雰囲気の形成が不十分"
      1: "相談しにくい雰囲気"
      X: "相談の機会や場面がなく判断不能"

  U18:
    title: "学習者に敬意を払っていた"
    category: "環境づくり"
    description: "研修医を1医師として扱っているかどうか"
    scoring_note: "5点は『敬意ある言動』に加え『医師としての承認行動（意見採用/役割付与/共同意思決定）』が確認できること。丁寧語だけでは4点。"
    criteria:
      5: "常に敬意をもって接し、学習者を一人の医師として扱う具体行動がある。誤りや意見相違があっても人格否定せず建設的に修正する"
      4: "適切に敬意を払っているが、医師としての承認行動や意見相違時の扱いの証拠が不足している"
      3: "基本的な敬意はあるが、上下関係が前面に出たり、呼称や態度に一貫性がない"
      2: "敬意が不十分"
      1: "敬意がない"
      X: "敬意を示す機会が限定的で判断不能"

  U19:
    title: "指導に対する熱意が見られた"
    category: "環境づくり"
    description: "研修医に成長してほしいという熱意が評価者の主観で感じられたかどうか"
    criteria:
      5: "学習者の成長への強い熱意が一貫して感じられる"
      4: "指導に対する熱意が適切に感じられる"
      3: "基本的な熱意が感じられる"
      2: "熱意が不十分（機械的指導）"
      1: "熱意が感じられない（無関心、投げやり）"
      X: "熱意を評価する機会が十分でなかった場合"

  U20:
    title: "全体としてフィードバック能力は身についている"
    category: "全体評価"
    description: "全体を通じて、一人でフィードバックを行なっても大丈夫かどうか"
    criteria:
      5: "一人でフィードバックを行っても全く問題なく、他の指導医の模範となる"
      4: "一人でフィードバックを行える能力が身についている"
      3: "基本的なフィードバック能力は身についている"
      2: "フィードバック能力に問題があり、改善が必要"
      1: "フィードバック能力が不十分で、一人では指導できない"
      X: "全体的な評価をする材料が大幅に不足している場合"
