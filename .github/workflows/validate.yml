name: Validate public data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python analysis/reproduce_results.py --validate-only
      - run: python analysis/audit_public_release.py
